[project]
name = "github-portfolio-auditor"
version = "0.1.0"
description = "Scan and analyze your entire GitHub portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.0",
    "typer>=0.9",
    "rich>=13",
    "pydantic>=2",
    "requests-cache",
    "markdown",
]

[project.scripts]
gha = "github_portfolio_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]